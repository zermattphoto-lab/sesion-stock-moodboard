<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escenas · 20 acciones por localización</title><style>:root{--ink:#202526;--paper:#f1eee8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1450px;margin:auto;padding:24px 28px 60px}.hero{background:#fff;border-radius:26px;padding:30px;margin:20px 0 26px}.hero h1{font-size:clamp(42px,7vw,90px);line-height:.84;letter-spacing:-.08em;margin:0 0 16px}.hero p{max-width:780px;line-height:1.45;color:#5e6965}.section{border-radius:24px;padding:22px;margin:22px 0;background:#fff}.section h2{font-size:clamp(30px,5vw,58px);line-height:.9;letter-spacing:-.07em;margin:0 0 8px}.section>p{font-size:14px;color:#64706b;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#f7f5f0;border-radius:14px;overflow:hidden}.scene{height:210px;background-repeat:no-repeat;background-size:400% 500%;background-color:#d7d2c9}.body{padding:11px}.num{font-size:10px;font-weight:900;letter-spacing:.12em;color:#7a8580}.body h3{font-size:17px;line-height:1;margin:6px 0}.body p{font-size:11px;line-height:1.35;color:#65706b;margin:0}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.wrap{padding:15px 12px 40px}.grid{grid-template-columns:repeat(2,1fr)}.scene{height:170px}}@media(max-width:420px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>Escenas<br>por acción.</h1><p>Ahora cada viñeta está separada y lleva su escena escrita debajo. Dentro de cada bloque se mantiene el mismo lugar, los mismos modelos y el mismo decorado.</p></section><div id="app"></div></main><script>
